# SaveAny-Bot 生产部署配置模板 (NAS / Docker)
# 使用前必须修改的项目已用 "!!必改!!" 标注
# 编码必须是 UTF-8
# 详细配置说明见 https://sabot.unv.app/deployment/configuration

workers = 4    # 同时下载文件数
retry = 3      # 下载失败重试次数
threads = 4    # 单任务最大下载线程数
stream = false # 流式模式, NAS 硬盘充足建议 false

[log]
level = "info" # 稳定运行后建议 info, 排查问题时改 debug

[telegram]
# !!必改!! BotFather 创建 Bot 后获得的 token
token = "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
# 更换 token 后需删除 data/session.db

# 相册(媒体组)处理方式. Telegram 里一个帖子若是多图/多视频, 转发其中一条时
# 客户端会把整组一起转发, 默认会把整组都保存下来.
#   batch   全部保存 (上游默认行为)
#   video   只保存视频, 跳过图片
#   largest 只保存体积最大的一个 (通常就是主视频)
#   first   只保存第一条
album_mode = "batch"
# 相册聚合窗口(秒): 同一 group 的消息在窗口内收齐后一起建任务
# media_group_timeout = 1

[telegram.proxy]
# !!按需!! NAS 无法直连 Telegram 时启用 (与下面 [parser.twitter] proxy 的区别:
# 这里是 bot 连接 Telegram 服务器用的代理; twitter proxy 是访问 fxtwitter API 用的代理)
enable = false
# 常见 NAS 部署: 代理跑在宿主机, 容器用 host 网络时填 127.0.0.1; 桥接网络时填宿主机内网 IP
# url = "socks5://127.0.0.1:7890"

[aria2]
enable = false

[ytdlp]
# 官方镜像内已内置 yt-dlp, 默认 "yt-dlp" 即可; 本机运行时改为可执行文件的绝对路径
path = "yt-dlp"
# 0 = 不限制分辨率, 下载最高画质 (本项目核心需求)
max_height = 0
# 留空则按 max_height 逻辑; 也可显式指定, 例如 "bv*+ba/b"
format = ""
# 转封装为 mp4 (4K 源可能是 AV1/VP9, 仅封装不重编码)
recode = "mp4"
filename_template = "%(title)s.%(ext)s"
restrict_filenames = false
# !!按需!! X 登录 cookies (Netscape 格式), 用于 NSFW / 限流场景的 yt-dlp 兜底.
# 容器内路径对应 docker-compose.yml 中的挂载: ./cookies.txt:/app/cookies.txt
cookies_file = "/app/cookies.txt"
# 解析器全部失败时自动改用 yt-dlp 下载消息中的链接 (推荐开启)
fallback = true

[parser]
# 启用 JS 解析器插件 (getxbot 兜底插件需要)
plugin_enable = true
plugin_dirs = ["./plugins"]
# !!按需!! 解析器与视频下载共用的代理 (影响 fxtwitter API、插件请求,
# 以及 video.twimg.com 等直链的实际下载).
# 国内 NAS 直连 video.twimg.com 常被重置 (日志: connection reset by peer),
# 此时务必填这里; host 网络下代理跑在宿主机则用 127.0.0.1.
# proxy = "socks5://192.168.1.10:7891"

[parser.twitter]
api_domain = "api.fxtwitter.com"
# !!按需!! 仅访问 fxtwitter API 使用的代理 (与 [telegram.proxy] 互不影响).
# NAS 能直连 api.fxtwitter.com 则留空
# proxy = "http://127.0.0.1:7890"

[parser.kemono]

[api]
enable = false
host = "0.0.0.0"
port = 8080
token = ""

# 本地存储: 视频落盘目录, 对应 docker-compose.yml 中 ./downloads:/app/downloads
[[storages]]
name = "nas-local"
type = "local"
enable = true
base_path = "/app/downloads"

# !!必改!! 白名单: 仅填你自己的 Telegram 数字 id (向 @userinfobot 发消息可查)
[[users]]
id = 114514
storages = []      # 留空 + blacklist=true = 可用所有存储
blacklist = true
