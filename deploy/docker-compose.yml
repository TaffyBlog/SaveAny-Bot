# SaveAny-Bot NAS 部署 (使用 fork 的 GHCR 镜像, 免构建)
# 用法: 把 deploy/config.example.toml 复制为 config.toml 填入必改项,
#   与下面的目录结构一起放到 NAS 上某个目录:
#     ./docker-compose.yml
#     ./config.toml                (由 config.example.toml 复制改名)
#     ./plugins/getxbot_parser.js  (来自仓库 plugins/, getxbot 兜底插件需要)
#     ./cookies.txt                (X 登录 cookies, 可选)
#   data/ downloads/ cache/ 首次启动自动创建, plugins/ 需手动创建并放入插件
services:
  saveany-bot:
    image: ghcr.io/taffyblog/saveany-bot:latest # fork 镜像, push 到 main / 打 tag 后 Actions 自动构建 (已设为 Public, 免登录拉取)
    # 本地构建备选 (不想用 GHCR 时): 把上面的 image 换成下面这行, 并把整个 fork 仓库上传到 NAS
    # build: .
    container_name: saveany-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data                # 会话库与数据库, 容器重启不丢失
      - ./config.toml:/app/config.toml  # 配置文件
      - ./downloads:/app/downloads      # 视频落盘目录
      - ./cache:/app/cache              # 临时下载目录
      - ./plugins:/app/plugins          # JS 解析器插件 (getxbot 兜底)
      - ./cookies.txt:/app/cookies.txt:ro # X 登录 cookies (可选, 没有则删除此行)
    # 若 NAS 需要代理出网, 取消注释 (容器内进程读取):
    # environment:
    #   - HTTP_PROXY=http://192.168.1.10:7890
    #   - HTTPS_PROXY=http://192.168.1.10:7890
    #   - NO_PROXY=localhost,127.0.0.1
    # 说明: 上面的环境变量影响容器内所有 HTTP 出网 (含 yt-dlp, fxtwitter API);
    # Telegram 连接的代理用 config.toml 的 [telegram.proxy] 单独控制 (支持 socks5).
    # host 网络模式下代理跑在宿主机时, 代理地址填 127.0.0.1:
    network_mode: host
    # 若不用 host 网络, 删除上一行并取消注释端口映射:
    # ports:
    #   - "8080:8080"
