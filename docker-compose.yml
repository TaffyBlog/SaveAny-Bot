services:
  saveany-bot:
    image: ghcr.io/taffyblog/saveany-bot:latest # fork 镜像 (上游 ghcr.io/krau/saveany-bot 不含本 fork 改动)
    container_name: saveany-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    # 使用 host 模式以便访问宿主机服务 (如代理)
    # 如果你对 Docker 网络模式熟悉, 可以自行修改
    network_mode: host